version: 2
updates:
  # Python dependencies (requirements.txt, requirements-dev.txt).
  # xgboost/scikit-learn are pinned as defense-in-depth (see
  # KNOWN_ISSUES.md), but the pickle-compatibility risk they originally
  # guarded against was resolved by migrating model.pkl to XGBoost's
  # native format (model.json) - so a version bump here is lower-risk
  # than it used to be, just still worth a normal careful review.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # GitHub Actions versions (actions/checkout, actions/setup-python)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
